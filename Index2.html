<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's learn about Form with How to make forms</title>
</head>

<body>
    <form action="post">
        <label for="Start">Enter Your User Name:</label>
        <input type="text" name="Aryan" id="Start" placeholder="Enter Your User Name" autofocus required>
        <input type="reset" value="Reset">
        <br>
        <br>
        <label for="password">Enter Your Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter Your Password" required>
        
        <br>
        <br>
        <input type="radio" name="gender" value="Male" id="Moore" required>
        <label for="Moore">Male:</label>
        <input type="radio" name="gender" value="Female" id="radio" required>
        <label for="radio">Female:</label>
        <br>
        <br>
        <input type="checkbox" name="vehicle1" value="Bike" id="Bike" required>
        <label for="Bike"> I have a bike</label>
        <br>
        <br>
        <label for="Bikes">Bike Companies-</label>
        <select name="Bike Companies-" id="Bikes" required>
            <option value="Yamha">Yamha</option>
            <option value="Honda">Honda</option>
            <option value="TVS">TVS</option>
            <option value="Bajaj">Bajaj</option>
            <option value="Hero">Hero</option>
        </select>
        <br>
        <br>
        <input type="submit" value="Submit" required>
    </form>
</body>

</html>
